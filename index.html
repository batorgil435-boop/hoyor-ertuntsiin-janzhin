
<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бүлэг уншигч</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #0f1117;
      color: #e8eaf0;
      font-family: Arial, sans-serif;
      line-height: 1.8;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: #f4c66a;
      line-height: 1.4;
    }

    header p {
      color: #a9afbd;
    }

    h2 {
      font-size: 21px;
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 20px 0 35px;
    }

    .chapter {
      width: 100%;
      text-align: left;
      background: #1b1f2b;
      color: #e8eaf0;
      border: 1px solid #303748;
      border-radius: 10px;
      padding: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .chapter:hover {
      background: #292f40;
      border-color: #f4c66a;
    }

    .chapter.active {
      border-color: #f4c66a;
      background: #302a20;
    }

    .chapter strong {
      display: block;
      margin: 4px 0;
    }

    .number,
    .muted {
      color: #9ca5b5;
      font-size: 13px;
    }

    #reader {
      background: #181c26;
      border: 1px solid #303748;
      border-radius: 14px;
      padding: 24px;
      scroll-margin-top: 16px;
    }

    #chapterlabel {
      color: #f4c66a;
      font-size: 14px;
    }

    #readertitle {
      font-size: 25px;
      line-height: 1.5;
      margin: 10px 0 24px;
    }

    #storytext {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 17px;
      color: #e0e3eb;
      min-height: 100px;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #303748;
    }

    .nav-button {
      background: #f4c66a;
      color: #161616;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .nav-button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #counter {
      color: #a9afbd;
      font-size: 14px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #7e8798;
      font-size: 13px;
      margin-top: 35px;
    }

    @media (max-width: 500px) {
      .container {
        width: 94%;
        padding-top: 16px;
      }

      #reader {
        padding: 17px;
      }

      #readertitle {
        font-size: 21px;
      }

      #storytext {
        font-size: 16px;
      }

      .nav-button {
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>📖 Түүхийн ном</h1>
      <p>Унших бүлгээ сонгоно уу</p>
    </header>

    <section>
      <h2>Бүлгүүд</h2>
      <div id="chaptergrid" class="chapter-grid"></div>
    </section>

    <section id="reader">
      <div id="chapterlabel">1-р бүлэг</div>
      <h2 id="readertitle">Бүлгийн нэр</h2>

      <div id="storytext">Бүлгийн текст энд харагдана.</div>

      <div class="navigation">
        <button
          id="prev"
          class="nav-button"
          type="button"
          onclick="changeChapter(-1)">
          ← Өмнөх
        </button>

        <span id="counter">1 / 1</span>

        <button
          id="next"
          class="nav-button"
          type="button"
          onclick="changeChapter(1)">
          Дараагийн →
        </button>
      </div>
    </section>

    <footer>
      Бүлгээ сонгоод уншиж эхлээрэй.
    </footer>

  </main>

  <script>
    // БҮЛГҮҮДИЙН МЭДЭЭЛЭЛ
    // Бүлэг бүр: [дугаар, нэр, текст]

    const chapters = [
      [
        "1-р бүлэг",
        "Харанхуйгаас эхэлсэн хувь тавилан",
        `2026 оны Улаанбаатарт Оргил өдөр бүрийн дээрэлхэлт,
ганцаардалтай тэмцэнэ.

Сургуулийн дэвсгэр дээр болсон үйл явдлын дараа
тэр танихгүй тал нутаг руу очих болно.

Энд өөрийн зохиолын бүтэн текстийг оруулна уу.`
      ],

      [
        "2-р бүлэг",
        "Шинэ эхлэл",
        `Оргилын өмнө цоо шинэ зам нээгдэв.

Энэ бүлгийн бодит текстээ энд оруулна уу.`
      ],

      [
        "3-р бүлэг",
        "Нууцын мөрөөр",
        `Тэр болсон явдлын учрыг олохоор шийдэв.

Энэ бүлгийн бодит текстээ энд оруулна уу.`
      ]
    ];

    let current = 0;

    const grid = document.getElementById("chaptergrid");
    const reader = document.getElementById("reader");

    const chapterLabel = document.getElementById("chapterlabel");
    const readerTitle = document.getElementById("readertitle");
    const storyText = document.getElementById("storytext");
    const counter = document.getElementById("counter");
    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");

    // БҮЛГИЙН ЖАГСААЛТ ҮҮСГЭХ
    function createChapterList() {
      grid.replaceChildren();

      chapters.forEach((chapter, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "chapter";

        const number = document.createElement("span");
        number.className = "number";
        number.textContent = String(index + 1).padStart(2, "0");

        const title = document.createElement("strong");
        title.textContent = chapter[1];

        const subtitle = document.createElement("span");
        subtitle.className = "muted";
        subtitle.textContent = chapter[0];

        button.append(number, title, subtitle);

        button.addEventListener("click", () => {
          selectChapter(index, true);
        });

        grid.appendChild(button);
      });
    }

    // БҮЛЭГ СОНГОХ
    function selectChapter(index, shouldScroll = false) {
      if (index < 0 || index >= chapters.length) {
        return;
      }

      current = index;

      const chapter = chapters[current];

      chapterLabel.textContent = chapter[0];
      readerTitle.textContent = chapter[1];
      storyText.textContent = chapter[2];

      counter.textContent =
        (current + 1) + " / " + chapters.length;

      prevButton.disabled = current === 0;
      nextButton.disabled = current === chapters.length - 1;

      document.querySelectorAll(".chapter").forEach((button, i) => {
        button.classList.toggle("active", i === current);
        button.setAttribute(
          "aria-pressed",
          i === current ? "true" : "false"
        );
      });

      if (shouldScroll) {
        reader.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }

    // ӨМНӨХ / ДАРААГИЙН БҮЛЭГ
    function changeChapter(step) {
      const nextIndex = current + step;

      if (nextIndex < 0 || nextIndex >= chapters.length) {
        return;
      }

      selectChapter(nextIndex, true);
    }

    // ЭХЛЭХ
    createChapterList();
    selectChapter(0);
  </script>
</body>
</html>
